<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#06080c" />
<title>舒尔特方格 · 注意力训练</title>
<style>
  :root{
    --bg:#06080c;
    --cell-a:#1a2433;
    --cell-b:#141c27;
    --txt:#e8eef8;
    --dim:#7c8ba1;
    --acc:#38e0c8;
    --warn:#ff5d6c;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 700px at 50% -15%, #12202e 0%, rgba(6,8,12,0) 62%),
      var(--bg);
    color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overscroll-behavior:none;
  }

  .app{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:14px clamp(10px,3vw,26px) 10px;
  }

  /* ---------- 顶栏 ---------- */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{
    display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:600;letter-spacing:.08em;color:#a9b8cc;
  }
  .brand .dot{
    width:7px;height:7px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 12px var(--acc);
  }
  .sizes{
    display:flex;gap:2px;margin-left:auto;
    background:rgba(255,255,255,.04);padding:3px;border-radius:11px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .sizes button{
    border:0;background:transparent;color:var(--dim);
    font:inherit;font-size:13px;font-variant-numeric:tabular-nums;
    padding:6px 10px;border-radius:8px;cursor:pointer;transition:.16s;
  }
  .sizes button:hover{color:var(--txt)}
  .sizes button.on{background:rgba(56,224,200,.14);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(56,224,200,.28)}
  .tools{display:flex;gap:6px}
  .tool{
    border:0;background:rgba(255,255,255,.04);color:var(--dim);
    font:inherit;font-size:12px;padding:7px 10px;border-radius:9px;
    cursor:pointer;transition:.16s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .tool:hover{color:var(--txt);background:rgba(255,255,255,.07)}
  .tool.on{color:var(--acc);background:rgba(56,224,200,.12);box-shadow:inset 0 0 0 1px rgba(56,224,200,.26)}

  /* ---------- 统计 ---------- */
  .stage{
    flex:1;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(8px,1.8vh,18px);
  }
  .stats{
    display:flex;align-items:flex-end;justify-content:center;
    gap:clamp(16px,4.5vw,38px);
  }
  .stat{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:54px}
  .stat .k{font-size:11px;letter-spacing:.16em;color:var(--dim)}
  .stat .v{
    font-family:var(--mono);font-size:clamp(17px,3.2vw,24px);
    font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;
  }
  .stat .v.acc{color:var(--acc)}

  /* ---------- 棋盘 ---------- */
  .board{
    position:relative;
    flex:0 0 auto;
    width:min(90vw,58vh,640px);
    width:min(90vw,58dvh,640px);
    height:min(90vw,58vh,640px);
    height:min(90vw,58dvh,640px);
    aspect-ratio:1/1;
  }
  .grid{
    position:absolute;inset:0;
    display:grid;
    grid-template-columns:repeat(var(--n,5),1fr);
    grid-template-rows:repeat(var(--n,5),1fr);
    gap:clamp(4px,.9vmin,8px);
    padding:clamp(4px,.9vmin,8px);
    border-radius:18px;
    background:rgba(255,255,255,.022);
    box-shadow:0 0 0 1px rgba(255,255,255,.055), 0 28px 70px -28px rgba(0,0,0,.9);
  }
  .cell{
    display:flex;align-items:center;justify-content:center;
    border-radius:11px;
    background:linear-gradient(180deg,var(--cell-a),var(--cell-b));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.055), 0 1px 2px rgba(0,0,0,.45);
    color:var(--txt);
    font-family:var(--mono);
    font-weight:500;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
    transition:background .18s,color .18s,transform .08s,box-shadow .18s;
  }
  .cell:not(.done):hover{background:linear-gradient(180deg,#1f2b3c,#18222f)}
  .cell:not(.done):active{transform:scale(.96)}
  .cell.done{
    background:rgba(255,255,255,.018);
    color:rgba(232,238,248,.15);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);
    cursor:default;
  }
  .cell.wrong{
    background:linear-gradient(180deg,#3a1a1f,#2a1418);
    color:#ff9aa4;
    box-shadow:inset 0 0 0 1px rgba(255,93,108,.5);
    animation:shake .24s;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-5px)}
    50%{transform:translateX(5px)}
    75%{transform:translateX(-3px)}
  }
  .grid.masked .cell{color:transparent}

  .fixdot{
    position:absolute;left:50%;top:50%;
    width:12px;height:12px;margin:-6px 0 0 -6px;
    border-radius:50%;background:rgba(56,224,200,.92);
    box-shadow:0 0 0 2px rgba(4,8,12,.5), 0 0 16px rgba(56,224,200,.9);
    pointer-events:none;z-index:3;display:none;
  }
  .board.dot .fixdot{display:block;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{opacity:.55;transform:scale(1)}
    50%{opacity:1;transform:scale(1.28)}
  }

  /* ---------- 遮罩 ---------- */
  .overlay{
    position:absolute;inset:0;z-index:6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:20px;text-align:center;
    border-radius:18px;
    background:rgba(7,10,15,.86);
    opacity:0;pointer-events:none;transition:opacity .22s;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .overlay.solid{background:rgba(7,10,15,.96)}
  .ovTitle{font-size:clamp(17px,3vw,22px);font-weight:600;letter-spacing:.1em}
  .ovSub{font-size:13px;line-height:1.75;color:var(--dim);max-width:300px}

  .primary{
    border:0;cursor:pointer;font:inherit;font-size:15px;font-weight:600;
    padding:12px 30px;border-radius:12px;color:#04231f;
    background:linear-gradient(180deg,#57f0d8,#22c9b2);
    box-shadow:0 12px 28px -10px rgba(56,224,200,.75), inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .09s,filter .2s;
  }
  .primary:hover{filter:brightness(1.07)}
  .primary:active{transform:scale(.97)}

  .count{
    font-family:var(--mono);
    font-size:clamp(56px,15vw,110px);
    font-weight:700;line-height:1;color:var(--acc);
    text-shadow:0 0 44px rgba(56,224,200,.45);
    animation:pop .3s ease-out;
  }
  .count.go{font-size:clamp(34px,8vw,58px);letter-spacing:.14em}
  @keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}

  .bigNum{
    font-family:var(--mono);
    font-size:clamp(38px,9vw,58px);font-weight:700;line-height:1;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  }
  .bigNum span{font-size:.4em;font-weight:500;color:var(--dim);margin-left:3px}
  .rank{
    font-size:13px;font-weight:600;letter-spacing:.14em;
    padding:4px 12px;border-radius:999px;
  }
  .rank.s{color:#ffd166;background:rgba(255,209,102,.12)}
  .rank.a{color:var(--acc);background:rgba(56,224,200,.12)}
  .rank.b{color:#79b8ff;background:rgba(121,184,255,.12)}
  .rank.c{color:var(--dim);background:rgba(255,255,255,.06)}

  .result{
    display:flex;flex-direction:column;gap:5px;
    width:100%;max-width:230px;
    font-size:12.5px;color:var(--dim);
  }
  .result div{display:flex;justify-content:space-between;gap:16px}
  .result b{color:var(--txt);font-weight:500;font-variant-numeric:tabular-nums}
  .hist{
    font-family:var(--mono);font-size:11px;color:#7b8da4;
    letter-spacing:.02em;max-width:240px;line-height:1.6;
  }

  .hint{margin:0;font-size:12px;color:#5a6b80;text-align:center}

  @media (max-width:520px){
    .app{padding-left:8px;padding-right:8px}
    .bar{gap:8px;justify-content:center}
    .brand{display:none}
    .sizes{margin-left:0}
    .tools{margin-left:0}
    .sizes button{padding:6px 6.5px;font-size:12px}
    .tool{padding:7px 7px;font-size:11.5px}
    .stat{min-width:46px}
  }
  @media (max-height:620px){
    .hint{display:none}
    .stat .k{font-size:10px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="dot"></span><span class="name">舒尔特方格</span></div>
    <div class="sizes" id="sizes"></div>
    <div class="tools">
      <button id="btnSound" class="tool" type="button">音效</button>
      <button id="btnDot" class="tool" type="button">注视点</button>
      <button id="btnFull" class="tool" type="button">全屏</button>
    </div>
  </header>

  <main class="stage">
    <div class="stats">
      <div class="stat"><span class="k">用时</span><span class="v" id="time">0.00</span></div>
      <div class="stat"><span class="k">下一个</span><span class="v acc" id="target">1</span></div>
      <div class="stat"><span class="k">失误</span><span class="v" id="errs">0</span></div>
      <div class="stat"><span class="k">最佳</span><span class="v" id="best">--</span></div>
    </div>

    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="fixdot"></div>
      <div class="overlay" id="overlay"></div>
    </div>

    <p class="hint">空格 重新开始 · 眼睛盯住中心点，用余光找数字</p>
  </main>
</div>

<script>
(function () {
  'use strict';

  var el = function (id) { return document.getElementById(id); };
  var gridEl = el('grid');
  var boardEl = el('board');
  var overlayEl = el('overlay');
  var timeEl = el('time');
  var targetEl = el('target');
  var errEl = el('errs');
  var bestEl = el('best');

  var SIZES = [3, 4, 5, 6, 7];
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  var size = parseInt(LS.get('schulte.size', '5'), 10);
  if (SIZES.indexOf(size) < 0) size = 5;
  var soundOn = LS.get('schulte.sound', '1') === '1';
  var dotOn = LS.get('schulte.dot', '1') === '1';

  var cells = [];
  var next = 1;
  var errors = 0;
  var running = false;
  var startTs = 0;
  var rafId = 0;
  var roundToken = 0;
  var audioCtx = null;

  /* ---------------- 音效 ---------------- */
  function ac() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, dur, gain, type) {
    if (!soundOn) return;
    try {
      var c = ac();
      if (!c) return;
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      var t0 = c.currentTime;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gain || 0.07, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.08));
      o.connect(g);
      g.connect(c.destination);
      o.start(t0);
      o.stop(t0 + (dur || 0.08) + 0.03);
    } catch (e) { /* 静默失败 */ }
  }

  /* ---------------- 网格 ---------------- */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function buildGrid() {
    var total = size * size;
    var nums = [];
    for (var i = 1; i <= total; i++) nums.push(i);
    shuffle(nums);

    gridEl.style.setProperty('--n', String(size));
    gridEl.innerHTML = '';
    cells = nums.map(function (n) {
      var d = document.createElement('div');
      d.className = 'cell';
      d.dataset.num = String(n);
      d.textContent = String(n);
      gridEl.appendChild(d);
      return d;
    });
    fitFont();
  }

  function fitFont() {
    var rect = gridEl.getBoundingClientRect();
    if (!rect.width) return;
    var cs = getComputedStyle(gridEl);
    var gap = parseFloat(cs.columnGap) || 0;
    var padL = parseFloat(cs.paddingLeft) || 0;
    var inner = rect.width - padL * 2 - gap * (size - 1);
    var cell = inner / size;
    var fs = Math.max(9, Math.min(72, cell * 0.44));
    gridEl.style.fontSize = fs.toFixed(1) + 'px';
  }

  /* ---------------- 计时 ---------------- */
  function tick() {
    if (!running) return;
    timeEl.textContent = ((performance.now() - startTs) / 1000).toFixed(2);
    rafId = requestAnimationFrame(tick);
  }

  function resetStats() {
    errors = 0;
    next = 1;
    timeEl.textContent = '0.00';
    targetEl.textContent = '1';
    errEl.textContent = '0';
  }

  /* ---------------- 判定 ---------------- */
  function onPointerDown(e) {
    if (!running) return;
    var cell = e.target.closest ? e.target.closest('.cell') : null;
    if (!cell || !gridEl.contains(cell) || cell.classList.contains('done')) return;
    var n = parseInt(cell.dataset.num, 10);
    if (n === next) hit(cell);
    else miss(cell);
  }

  function hit(cell) {
    cell.classList.add('done');
    tone(600 + Math.min(next, 49) * 16, 0.055, 0.06);
    next++;
    if (next > size * size) {
      finish();
    } else {
      targetEl.textContent = String(next);
    }
  }

  function miss(cell) {
    errors++;
    errEl.textContent = String(errors);
    cell.classList.remove('wrong');
    void cell.offsetWidth;
    cell.classList.add('wrong');
    var c = cell;
    setTimeout(function () { c.classList.remove('wrong'); }, 260);
    tone(150, 0.12, 0.085, 'square');
  }

  /* ---------------- 成绩 ---------------- */
  function rating(avg) {
    if (avg <= 0.65) return { text: '神级反应', cls: 's' };
    if (avg <= 0.95) return { text: '优秀', cls: 'a' };
    if (avg <= 1.40) return { text: '良好', cls: 'b' };
    return { text: '继续练习', cls: 'c' };
  }

  function updateBest() {
    var best = parseInt(LS.get('schulte.best.' + size, '0'), 10) || 0;
    bestEl.textContent = best ? (best / 1000).toFixed(2) : '--';
  }

  function pushHist(ms) {
    var key = 'schulte.hist.' + size;
    var arr = [];
    try {
      var raw = JSON.parse(LS.get(key, '[]'));
      if (Array.isArray(raw)) arr = raw;
    } catch (e) { arr = []; }
    arr.push(Math.round(ms));
    if (arr.length > 20) arr = arr.slice(-20);
    LS.set(key, JSON.stringify(arr));
    return arr;
  }

  function finish() {
    running = false;
    syncDot();
    cancelAnimationFrame(rafId);
    var ms = performance.now() - startTs;
    timeEl.textContent = (ms / 1000).toFixed(2);
    targetEl.textContent = '✓';

    var key = 'schulte.best.' + size;
    var prev = parseInt(LS.get(key, '0'), 10) || 0;
    var isRecord = !prev || ms < prev;
    if (isRecord) LS.set(key, String(Math.round(ms)));
    updateBest();
    var hist = pushHist(ms);

    tone(660, 0.11, 0.075);
    setTimeout(function () { tone(880, 0.11, 0.075); }, 110);
    setTimeout(function () { tone(1120, 0.2, 0.08); }, 225);

    showResult(ms, prev, isRecord, hist);
  }

  function showResult(ms, prev, isRecord, hist) {
    var total = size * size;
    var avg = ms / 1000 / total;
    var r = rating(avg);
    var recent = (hist || []).slice(-5).map(function (v) {
      return (v / 1000).toFixed(1);
    }).join(' / ');
    overlayEl.innerHTML =
      '<div class="ovTitle">' + (isRecord && prev ? '新纪录' : '完成') + '</div>' +
      '<div class="bigNum">' + (ms / 1000).toFixed(2) + '<span>s</span></div>' +
      '<div class="rank ' + r.cls + '">' + r.text + '</div>' +
      '<div class="result">' +
        '<div><span>失误</span><b>' + errors + ' 次</b></div>' +
        '<div><span>平均每格</span><b>' + avg.toFixed(2) + ' s</b></div>' +
        '<div><span>此前最佳</span><b>' + (prev ? (prev / 1000).toFixed(2) + ' s' : '—') + '</b></div>' +
      '</div>' +
      ((hist && hist.length >= 2) ? '<div class="hist">近 ' + Math.min(hist.length, 5) + ' 次 ' + recent + '</div>' : '') +
      '<button class="primary" id="btnAgain" type="button">再来一局</button>';
    overlayEl.classList.add('solid');
    overlayEl.classList.add('show');
    el('btnAgain').onclick = startRound;
  }

  /* ---------------- 流程 ---------------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function showIdle() {
    running = false;
    roundToken++;
    cancelAnimationFrame(rafId);
    buildGrid();
    gridEl.classList.add('masked');
    resetStats();
    syncDot();
    overlayEl.classList.remove('solid');
    overlayEl.innerHTML =
      '<div class="ovTitle">舒尔特方格</div>' +
      '<div class="ovSub">按 1 → ' + (size * size) + ' 的顺序点击<br>眼睛盯住中心，靠余光搜索</div>' +
      '<button class="primary" id="btnStart" type="button">开始训练</button>';
    overlayEl.classList.add('show');
    el('btnStart').onclick = startRound;
  }

  function startRound() {
    roundToken++;
    var token = roundToken;
    running = false;
    cancelAnimationFrame(rafId);
    resetStats();
    buildGrid();
    gridEl.classList.add('masked');
    syncDot();
    overlayEl.classList.remove('solid');
    overlayEl.classList.add('show');
    overlayEl.innerHTML = '<div class="count">3</div>';
    tone(480, 0.07, 0.06);

    var seq = ['2', '1'];
    var i = 0;

    function step() {
      if (token !== roundToken) return;
      if (i < seq.length) {
        overlayEl.innerHTML = '<div class="count">' + seq[i] + '</div>';
        tone(480, 0.07, 0.06);
        i++;
        setTimeout(step, 620);
        return;
      }
      overlayEl.innerHTML = '<div class="count go">开始</div>';
      tone(940, 0.14, 0.08);
      setTimeout(function () {
        if (token !== roundToken) return;
        overlayEl.classList.remove('show');
        overlayEl.innerHTML = '';
        gridEl.classList.remove('masked');
        running = true;
        syncDot();
        startTs = performance.now();
        tick();
      }, 330);
    }
    setTimeout(step, 620);
  }

  /* ---------------- 设置 ---------------- */
  function setSize(n) {
    size = n;
    LS.set('schulte.size', String(n));
    Array.prototype.forEach.call(document.querySelectorAll('.sizes button'), function (b) {
      b.classList.toggle('on', parseInt(b.dataset.n, 10) === n);
    });
    updateBest();
    showIdle();
  }

  function applyToggles() {
    el('btnSound').classList.toggle('on', soundOn);
    el('btnDot').classList.toggle('on', dotOn);
    syncDot();
  }

  // 注视点仅在训练进行中显示
  function syncDot() {
    boardEl.classList.toggle('dot', dotOn && running);
  }

  function toggleFull() {
    try {
      if (!document.fullscreenElement) {
        var p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () {});
      } else {
        var q = document.exitFullscreen();
        if (q && q.catch) q.catch(function () {});
      }
    } catch (e) {}
  }

  /* ---------------- 初始化 ---------------- */
  var sizesEl = el('sizes');
  SIZES.forEach(function (n) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = n + '×' + n;
    b.dataset.n = String(n);
    b.addEventListener('click', function () { setSize(n); });
    sizesEl.appendChild(b);
  });

  el('btnSound').addEventListener('click', function () {
    soundOn = !soundOn;
    LS.set('schulte.sound', soundOn ? '1' : '0');
    applyToggles();
    if (soundOn) tone(720, 0.06, 0.06);
  });

  el('btnDot').addEventListener('click', function () {
    dotOn = !dotOn;
    LS.set('schulte.dot', dotOn ? '1' : '0');
    applyToggles();
  });

  el('btnFull').addEventListener('click', toggleFull);

  gridEl.addEventListener('pointerdown', onPointerDown);

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ') {
      if (e.target && e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      if (!running) startRound();
    }
  });

  if (window.ResizeObserver) {
    new ResizeObserver(fitFont).observe(boardEl);
  } else {
    window.addEventListener('resize', fitFont);
  }
  window.addEventListener('orientationchange', function () { setTimeout(fitFont, 120); });

  applyToggles();
  updateBest();
  showIdle();
})();
</script>
</body>
</html>
